<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 13px;
            color: #333;
            background: #eef1f5;
            padding: 12px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #ccc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            font-size: 14px;
            margin-bottom: 8px;
            background: #e0e4e9;
            padding: 4px 8px;
            border-radius: 3px;
            border-left: 4px solid #4a6fa5;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 12px;
            height: calc(100vh - 60px);
        }

        .panel {
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 8px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 3px;
            font-size: 12px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 5px 7px;
            border: 1px solid #aaa;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
        }

        input[type="color"] {
            border: none;
            width: 28px;
            height: 24px;
            cursor: pointer;
            background: none;
        }

        textarea {
            resize: vertical;
        }

        button {
            padding: 5px 10px;
            background: #4a6fa5;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        button:hover {
            background: #3b5984;
        }

        button.btn-success {
            background: #28a745;
        }

        button.btn-success:hover {
            background: #218838;
        }

        button.btn-danger {
            background: #dc3545;
            padding: 2px 6px;
            font-size: 11px;
        }

        button.btn-danger:hover {
            background: #c82333;
        }

        button.btn-secondary {
            background: #6c757d;
        }

        .party-row {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
            background: #f8f9fa;
            padding: 4px;
            border: 1px solid #e2e8f0;
            border-radius: 3px;
        }

        .state-card {
            background: #f4f6f9;
            border: 1px solid #cbd5e1;
            padding: 8px;
            border-radius: 4px;
        }

        .support-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .support-row label {
            width: 60px;
            margin-bottom: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preview-container {
            border: 1px solid #aaa;
            background: #ffffff;
            border-radius: 4px;
            padding: 10px;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            position: relative;
        }

        .preview-container svg {
            max-width: 100%;
            max-height: 400px;
            height: auto;
        }

        /* SVG内のインタラクティブスタイル（transitionと重い処理を削除） */
        .preview-container svg [id] {
            cursor: pointer;
        }

        .preview-container svg [id]:hover {
            opacity: 0.75;
            stroke: #333;
            stroke-width: 1.5px;
        }

        .preview-container svg [id].configured {
            stroke: #2563eb;
            stroke-width: 1px;
        }

        .preview-container svg [id].active-editing {
            stroke: #ff0000;
            stroke-width: 2.5px;
            /* 重い drop-shadow は削除しました */
        }

        .state-list {
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 3px;
            margin-top: 6px;
        }

        .state-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-bottom: 1px solid #eee;
            font-size: 11px;
        }

        .state-item:hover {
            background: #e2e8f0;
            cursor: pointer;
        }

        .output-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .output-area textarea {
            flex: 1;
            min-height: 180px;
            background: #1e1e1e;
            color: #00ff66;
            font-size: 11px;
            line-height: 1.3;
        }

        .badge {
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 3px;
            background: #0284c7;
            color: white;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <h1>
        <span>選挙マップエディタ <span style="font-size: 11px; font-weight: normal; color: #666;">Map Data
                Generator</span></span>
        <button class="btn-secondary" onclick="loadSampleMap()">サンプルSVGをロード</button>
    </h1>

    <div class="main-layout">
        <!-- 左パネル: 設定と入力フォーム -->
        <div class="panel">

            <!-- 1. マップ基本情報 -->
            <div>
                <h2>1. マップ基本情報</h2>
                <div class="form-group">
                    <label>マップ名 (name):</label>
                    <input type="text" id="mapName" value="現代アメリカ" oninput="generateOutput()">
                </div>
                <div class="form-group">
                    <label>SVGコード貼り付け:</label>
                    <textarea id="svgInput" rows="3" placeholder='<svg id="map" ...>...</svg>'
                        oninput="updateMapSVG()"></textarea>
                </div>
            </div>

            <!-- 2. 政党の設定 -->
            <div>
                <h2>2. 政党の設定 (Parties)</h2>
                <div id="partiesContainer"></div>
                <button type="button" onclick="addParty()" style="margin-top:4px;">＋ 政党を追加</button>
            </div>

            <!-- 3. 州データ追加・編集 -->
            <div>
                <h2>3. 州データ編集 (States)</h2>
                <div class="state-card">
                    <div style="display: flex; gap: 8px;">
                        <div class="form-group" style="flex:1;">
                            <label>州コード (ID):</label>
                            <input type="text" id="stateId" placeholder="例: AL" oninput="onStateIdInput(this.value)">
                        </div>
                        <div class="form-group" style="width: 90px;">
                            <label>選挙人票:</label>
                            <input type="number" id="stateVotes" value="3">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>クラス名 (class):</label>
                        <input type="text" id="stateClass" placeholder="例: state like-DEM">
                    </div>

                    <label style="margin-top: 6px;">基礎支持率 (baseSupport %):</label>
                    <div id="supportInputsContainer" style="margin-top:4px;"></div>

                    <div style="display: flex; gap: 6px; margin-top: 10px;">
                        <button type="button" class="btn-success" onclick="addOrUpdateState()" style="flex:1;">この州を保存 /
                            更新</button>
                        <button type="button" class="btn-secondary" onclick="clearStateForm()">クリア</button>
                    </div>
                </div>

                <!-- 登録済み州リスト -->
                <div style="margin-top: 10px;">
                    <label>登録済み州一覧 (<span id="stateCount">0</span>):</label>
                    <div class="state-list" id="stateList"></div>
                </div>
            </div>

        </div>

        <!-- 右パネル: プレビュー & 出力 -->
        <div class="panel">
            <div>
                <h2>4. マップ プレビュー (クリックして州を選択)</h2>
                <div class="preview-container" id="svgPreview" style="width:100%">
                    <span style="color: #999;">ここにマップが表示されます</span>
                </div>
            </div>

            <div class="output-area">
                <h2>5. 出力 (JavaScript / JSON)</h2>
                <textarea id="codeOutput" readonly></textarea>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="copyMsg" style="color: #28a745; font-weight: bold; font-size: 11px;"></span>
                    <button onclick="copyToClipboard()">クリップボードにコピー</button>
                </div>
            </div>
        </div>
    </div>

            parties: [

        let activeEditingStateId = "";

        // DOMロード時初期化
        window.onload = function () {
            renderParties();
            renderSupportInputs();
            generateOutput();
        };

        // --- 政党管理 (Parties) ---
        function renderParties() {
            const container = document.getElementById("partiesContainer");
            container.innerHTML = "";

            mapData.parties.forEach((p, index) => {
                // RGB文字列からHEX変換（カラーピッカー用）
                const hexColor = rgbToHex(p.color);

                const row = document.createElement("div");
                row.className = "party-row";
                row.innerHTML = `
          <input type="text" value="${escapeHtml(p.id)}" placeholder="ID" style="width: 55px;" onchange="updateParty(${index}, 'id', this.value)">
          <input type="text" value="${escapeHtml(p.name)}" placeholder="党名" style="flex:1;" onchange="updateParty(${index}, 'name', this.value)">
          <input type="color" value="${hexColor}" title="色を選択" onchange="updatePartyColorFromPicker(${index}, this.value)">
          <input type="text" value="${escapeHtml(p.color)}" placeholder="rgb(...)" style="width: 110px;" onchange="updateParty(${index}, 'color', this.value)">
          <button type="button" class="btn-danger" onclick="removeParty(${index})">×</button>
        `;
                container.appendChild(row);
            });

            renderSupportInputs();
            generateOutput();
        }

        function addParty() {
            const newId = "P" + (mapData.parties.length + 1);
            mapData.parties.push({ id: newId, name: "新党", color: "rgb(128, 128, 128)" });
            renderParties();
        }

        function removeParty(index) {
            if (mapData.parties.length <= 1) {
                alert("政党は最低1つ必要です。");
                return;
            }
            const removedParty = mapData.parties[index];
            mapData.parties.splice(index, 1);

            // 既存の州データからも該当政党の支持率を削除
            Object.keys(mapData.states).forEach(st => {
                if (mapData.states[st].baseSupport) {
                    delete mapData.states[st].baseSupport[removedParty.id];
                }
            });

            renderParties();
        }

        function updateParty(index, key, value) {
            const oldId = mapData.parties[index].id;
            mapData.parties[index][key] = value;

            // IDが変更された場合、各州のbaseSupportのキーも更新
            if (key === 'id' && oldId !== value) {
                Object.keys(mapData.states).forEach(st => {
                    if (mapData.states[st].baseSupport && mapData.states[st].baseSupport[oldId] !== undefined) {
                        mapData.states[st].baseSupport[value] = mapData.states[st].baseSupport[oldId];
                        delete mapData.states[st].baseSupport[oldId];
                    }
                });
            }

            renderParties();
        }

        function updatePartyColorFromPicker(index, hex) {
            const rgb = hexToRgb(hex);
            mapData.parties[index].color = rgb;
            renderParties();
        }

        // --- 州入力フォーム支持率同期 ---
        function renderSupportInputs() {
            const container = document.getElementById("supportInputsContainer");
            container.innerHTML = "";

            mapData.parties.forEach(p => {
                const div = document.createElement("div");
                div.className = "support-row";
                div.style.cssText = "display: flex; align-items: center; gap: 8px; margin-bottom: 6px;";

                div.innerHTML = `
            <label style="width: 50px; font-weight: bold;" title="${escapeHtml(p.name)} (${escapeHtml(p.id)})">${escapeHtml(p.id)}:</label>
            <input type="range" min="0" max="100" step="0.1" id="range_${p.id}" value="0" style="flex: 1;" oninput="syncSupportInput('${p.id}', 'range')">
            <input type="number" min="0" max="100" step="0.1" id="support_${p.id}" value="0" style="width: 65px;" oninput="syncSupportInput('${p.id}', 'number')"> %
        `;
                container.appendChild(div);
            });
        }

        // スライダーと数値入力ボックスを連動させる関数
        function syncSupportInput(partyId, source) {
            const range = document.getElementById(`range_${partyId}`);
            const number = document.getElementById(`support_${partyId}`);

            if (source === 'range') {
                number.value = range.value;
            } else {
                range.value = number.value;
            }
        }
        // --- SVG プレビュー & インタラクション ---
        function updateMapSVG() {
            const svgCode = document.getElementById("svgInput").value;
            mapData.map = svgCode;
            const previewContainer = document.getElementById("svgPreview");

            if (!svgCode.trim()) {
                previewContainer.innerHTML = '<span style="color: #999;">ここにSVGマップが表示されます</span>';
                generateOutput();
                return;
            }

            previewContainer.innerHTML = svgCode;
            attachSvgEvents();
            highlightStatesOnMap();
            generateOutput();
            const panZoomMap = svgPanZoom('#svgPreview svg', {
                zoomEnabled: true,          // ホイールでの拡大・縮小を有効化
                controlIconsEnabled: false,  // 拡大・縮小ボタンを右下に表示（不要なら false）
                minZoom: 0.5,               // 最小倍率
                maxZoom: 10                 // 最大倍率
            });
        }



        function attachSvgEvents() {
            const svgEl = document.querySelector("#svgPreview svg");
            if (!svgEl) return;

            // SVG内部のすべてのID付き要素にクリックイベント付与
            const elements = svgEl.querySelectorAll("[id]");
            elements.forEach(el => {
                el.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const stateId = el.getAttribute("id");
                    if (stateId) {
                        selectStateForEdit(stateId);
                    }
                });
            });
        }
        function highlightStatesOnMap() {
            const svgEl = document.querySelector("#svgPreview svg");
            if (!svgEl) return;

            // 政党ID -> 色 のマッピングを作成
            const partyColorMap = {};
            mapData.parties.forEach(p => {
                partyColorMap[p.id] = p.color;
            });

            const elements = svgEl.querySelectorAll("[id]");
            elements.forEach(el => {
                const id = el.getAttribute("id");
                el.classList.remove("configured", "active-editing");

                if (id === activeEditingStateId) {
                    el.classList.add("active-editing");
                } else if (mapData.states[id]) {
                    el.classList.add("configured");
                }

                // --- ここから政党色の反映処理 ---
                const state = mapData.states[id];
                if (state && state.baseSupport) {
                    let maxPartyId = null;
                    let maxSupport = -1;

                    // 一番支持率が高い政党を探索
                    Object.keys(state.baseSupport).forEach(partyId => {
                        const supportVal = Number(state.baseSupport[partyId]) || 0;
                        if (supportVal > maxSupport) {
                            maxSupport = supportVal;
                            maxPartyId = partyId;
                        }
                    });

                    // 1番高い支持率の政党色を塗りつぶしに適用
                    if (maxPartyId && partyColorMap[maxPartyId] && maxSupport > 0) {
                        el.style.fill = partyColorMap[maxPartyId];
                    } else {
                        el.style.fill = "#b3b3b3"; // データはあるけど支持率が0等の場合
                    }
                } else {
                    el.style.fill = "#b3b3b3"; // 未設定の州のデフォルト色
                }
            });
        }
        // --- 州データ追加・更新・選択 ---
        function selectStateForEdit(id) {
            document.getElementById("stateId").value = id;
            activeEditingStateId = id;

            if (mapData.states[id]) {
                // 既存データをフォームに復元
                const state = mapData.states[id];
                document.getElementById("stateVotes").value = state.votes || 0;
                document.getElementById("stateClass").value = state.class || "";

                mapData.parties.forEach(p => {
                    const val = (state.baseSupport && state.baseSupport[p.id] !== undefined) ? state.baseSupport[p.id] : 0;
                    const input = document.getElementById(`support_${p.id}`);
                    if (input) input.value = val;
                });
            } else {
                // 新規州選択時
                document.getElementById("stateVotes").value = 3;
                document.getElementById("stateClass").value = "state";
                mapData.parties.forEach(p => {
                    const input = document.getElementById(`support_${p.id}`);
                    if (input) input.value = 0;
                });
            }

            highlightStatesOnMap();
        }

        function onStateIdInput(val) {
            activeEditingStateId = val.trim().toUpperCase();
            highlightStatesOnMap();
        }

        function addOrUpdateState() {
            const id = document.getElementById("stateId").value.trim().toUpperCase();
            if (!id) {
                alert("州コード (ID) を入力してください。");
                return;
            }

            const votes = Number(document.getElementById("stateVotes").value);
            const className = document.getElementById("stateClass").value.trim();

            const baseSupport = {};
            mapData.parties.forEach(p => {
                const input = document.getElementById(`support_${p.id}`);
                baseSupport[p.id] = input ? Number(input.value) : 0;
            });

            mapData.states[id] = {
                votes: votes,
                class: className,
                baseSupport: baseSupport
            };

            renderStateList();
            highlightStatesOnMap();
            generateOutput();

            // 入力後クリア
            clearStateForm();
        }

        function clearStateForm() {
            document.getElementById("stateId").value = "";
            document.getElementById("stateClass").value = "";
            document.getElementById("stateVotes").value = 3;
            mapData.parties.forEach(p => {
                const input = document.getElementById(`support_${p.id}`);
                if (input) input.value = 0;
            });
            activeEditingStateId = "";
            highlightStatesOnMap();
        }

        function removeState(id) {
            delete mapData.states[id];
            renderStateList();
            highlightStatesOnMap();
            generateOutput();
            if (activeEditingStateId === id) {
                clearStateForm();
            }
        }

        function renderStateList() {
            const listEl = document.getElementById("stateList");
            const countEl = document.getElementById("stateCount");
            listEl.innerHTML = "";

            const stateKeys = Object.keys(mapData.states).sort();
            countEl.textContent = stateKeys.length;

            stateKeys.forEach(id => {
                const st = mapData.states[id];
                const item = document.createElement("div");
                item.className = "state-item";
                item.innerHTML = `
          <span onclick="selectStateForEdit('${id}')" style="font-weight:bold; flex:1;">
            ${id} (${st.votes}票) - <span style="color:#666;">${escapeHtml(st.class)}</span>
          </span>
          <button class="btn-danger" onclick="removeState('${id}')">削除</button>
        `;
                listEl.appendChild(item);
            });
        }

        // --- 出力生成 (JS Object Format) ---
        function generateOutput() {
            mapData.name = document.getElementById("mapName").value;

            // リクエストに合わせたJS constコード形式でフォーマット
            let code = `const map = {\n`;
            code += `    name: ${JSON.stringify(mapData.name)},\n`;
            code += `    map:\n        \`${mapData.map}\`,\n`;
            code += `    parties: ${JSON.stringify(mapData.parties, null, 8)},\n`;
            code += `    states: ${JSON.stringify(mapData.states, null, 8)}\n`;
            code += `};`;

            document.getElementById("codeOutput").value = code;
        }

        function copyToClipboard() {
            const textarea = document.getElementById("codeOutput");
            textarea.select();
            document.execCommand('copy');

            const msg = document.getElementById("copyMsg");
            msg.textContent = "コピーしました！";
            setTimeout(() => msg.textContent = "", 2000);
        }

        // --- 補助関数 ---
        function rgbToHex(rgbStr) {
            if (!rgbStr) return "#888888";
            const match = rgbStr.match(/\d+/g);
            if (!match || match.length < 3) return "#888888";
            const r = parseInt(match[0]).toString(16).padStart(2, '0');
            const g = parseInt(match[1]).toString(16).padStart(2, '0');
            const b = parseInt(match[2]).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
